<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a21caf"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5d0fe"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- barras -->
  <g fill="#ffffff" opacity="0.22">
    <rect x="250" y="600" width="112" height="190" rx="36"/>
    <rect x="430" y="520" width="112" height="270" rx="36"/>
    <rect x="610" y="430" width="112" height="360" rx="36"/>
  </g>

  <!-- linha de crescimento -->
  <polyline points="250,650 430,540 612,590 800,360"
            fill="none" stroke="url(#line)" stroke-width="58"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="800" cy="360" r="52" fill="#ffffff"/>
  <circle cx="800" cy="360" r="22" fill="#a21caf"/>
</svg>
